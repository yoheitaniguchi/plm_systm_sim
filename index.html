<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PLMシミュレーター</title>
    <meta name="color-scheme" content="light dark" />
    <script>
      // 描画前にテーマを当てる（読み込み直後に白く光らないように）。規則は src/ui/theme.ts と同じ（PLM-EXT-26）
      (function () {
        var pref = 'system';
        try {
          var raw = localStorage.getItem('plm-systm-sim:theme');
          if (raw === 'light' || raw === 'dark') pref = raw;
        } catch (e) {}
        var dark = pref === 'dark' || (pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    <script type="module" crossorigin src="/plm_systm_sim/assets/index-o8_Xr1R-.js"></script>
    <link rel="stylesheet" crossorigin href="/plm_systm_sim/assets/index-D8170ZQV.css">
  </head>

    <div id="root"></div>
  </body>
</html>
